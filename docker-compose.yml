version: "3.8"

services:
  app:
    build: .
    container_name: read-receipt-tracker
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/receipts.db
      - API_KEY=${API_KEY:-}
      - ENABLE_GEO=${ENABLE_GEO:-1}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
