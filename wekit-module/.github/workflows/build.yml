name: Build & Release
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
env:
  JAVA_VERSION: '21'
  NDK_VERSION: '30.0.14904198'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;${{ env.NDK_VERSION }}'
      - name: Symlink android-37 platform
        run: |
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
            echo "Created symlink android-37 -> android-37.0"
          fi
          ls "$ANDROID_SDK_ROOT/platforms/"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      # ═══════════════════════════════════════════════════════════════════
      # 构建层1: Standard 版 (libxposed 入口, 适用于 LSPosed / 现代框架)
      # ═══════════════════════════════════════════════════════════════════
      - name: Build Standard APK
        run: |
          chmod +x x gradlew
          ./x build --flavor standard --release
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
      # ═══════════════════════════════════════════════════════════════════
      # 构建层2: Legacy 版 (传统 de.robv 入口, 适用于老旧框架)
      # ═══════════════════════════════════════════════════════════════════
      - name: Build Legacy APK
        run: |
          ./x build --flavor legacy --release
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
      # ═══════════════════════════════════════════════════════════════════
      # 构建层3: Script-Deps DEX (fastjson2 + okhttp + kotlin-stdlib)
      # 供 Java/BeanShell 插件运行时加载
      # ═══════════════════════════════════════════════════════════════════
      - name: Build Script-Deps DEX
        run: |
          ./gradlew generateScriptDepsDex
          find app/build/outputs/script-deps -name "*.dex" -type f
      - name: Find APKs
        run: |
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -la {} \;
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wekit-apks
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/script-deps/**/*.dex
          retention-days: 30
  package-java-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package Java plugin
        run: |
          cd server/read-tracker-java
          zip -r ../../read-tracker-java-plugin.zip . -x "*.git*"
          cd ../..
          ls -la read-tracker-java-plugin.zip
      - name: Upload Java plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: read-tracker-java-plugin
          path: read-tracker-java-plugin.zip
          retention-days: 30
  release:
    needs: [build-apk, package-java-plugin]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wekit-apks
          path: artifacts
      - name: Download Java plugin
        uses: actions/download-artifact@v4
        with:
          name: read-tracker-java-plugin
          path: artifacts
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ steps.date.outputs.date }}
          name: CI Build ${{ steps.date.outputs.date }}
          body: |
            ## CI 自动构建 — WeKit 修改版 (已读追踪修复版)

            本发行版由 GitHub Actions 自动构建，基于 WeKit 最新 dev 分支，针对 read-receipt-tracker 后端做了兼容性修复。

            ### 📱 WeKit APK

            | 文件 | 入口类型 | 适用框架 |
            |------|---------|---------|
            | `app-standard-release.apk` | libxposed | LSPosed / 现代 Xposed 框架 |
            | `app-legacy-release.apk` | de.robv | 传统/老旧 Xposed 框架 |

            ### 🔧 本次修复

            1. **已读追踪注册失败修复**: 将"先注册后发送"改为"先发送后异步注册"。
               - 消息 ID 在本地 `computeId()` 计算，像素 URL 已嵌入 XML 卡片
               - 注册仅用于服务器记录消息明文，不影响像素追踪和已读计数
               - 服务器暂时不可达时不再阻塞消息发送

            2. **Java 插件混淆规则修复**: 恢复 fastjson2 / okhttp / okio / kotlin 的 ProGuard keep 规则，
               确保 `read-tracker-java` 等 Java/BeanShell 插件可正常通过反射访问这些库。

            ### 🔌 Java 版已读服务器插件
            独立的已读追踪服务器，支持以 HChat 插件或 WeKit Java 脚本形式运行。
            - 内置 cloudflared 公网隧道
            - Web 控制台 + 悬浮仪表盘
            - IP 地理位置查询

            ### 📦 Script-Deps DEX
            `classes.dex` — 包含 fastjson2 + okhttp + kotlin-stdlib，供 Java 插件运行时加载。

            ---
            - 构建分支: ${{ github.ref_name }}
            - 提交: ${{ github.sha }}
            - 构建时间: ${{ steps.date.outputs.date }}
          files: artifacts/*
          draft: false
          prerelease: true
