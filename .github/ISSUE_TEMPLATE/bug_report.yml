name: Bug 报告
description: 报告一个 Bug 帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告 Bug！请填写以下信息。
  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清晰简洁地描述 Bug 是什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现这个 Bug？
      placeholder: |
        1. 启动服务 '...'
        2. 调用 API '...'
        3. 看到错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、Python 版本、部署方式等
      placeholder: |
        - OS: Ubuntu 22.04
        - Python: 3.12
        - 部署方式: Docker / systemd / Termux
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志/截图
      description: 相关的错误日志或截图
    validations:
      required: false
