name: 功能请求
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题是什么？
      description: 清晰简洁地描述这个功能请求要解决的问题。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 清晰简洁地描述你希望发生什么。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你考虑过的其他解决方案或功能。
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 其他相关的上下文、截图或参考链接。
    validations:
      required: false
