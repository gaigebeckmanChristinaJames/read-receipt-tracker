name: Build & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  NDK_VERSION: '30.0.14904198'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wekit-module
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libc6-dev gcc-multilib

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;${{ env.NDK_VERSION }}'

      - name: Symlink android-37 platform
        run: |
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('wekit-module/**/*.gradle*', 'wekit-module/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wekit-module/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('wekit-module/**/Cargo.lock') }}

      - name: Build APK
        run: |
          chmod +x x gradlew
          ./x build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}

      - name: Find APK
        run: find app/build/outputs/apk -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wekit-standard-debug
          path: wekit-module/app/build/outputs/apk/**/*.apk
          retention-days: 30

  package-java-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Java plugins
        run: |
          # Server plugin
          cd plugins/java-read-tracker
          zip -r ../../read-tracker-java-server.zip . -x "*.git*"
          cd ../..
          # Client plugin (HChat/WA)
          cd plugins/read-tracker-client
          zip -r ../../read-tracker-java-client.zip . -x "*.git*"
          cd ../..
          ls -la read-tracker-java-*.zip

      - name: Upload Java plugins artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-plugins
          path: read-tracker-java-*.zip
          retention-days: 30

  release:
    needs: [build-apk, package-java-plugins]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wekit-standard-debug
          path: artifacts

      - name: Download Java plugins
        uses: actions/download-artifact@v4
        with:
          name: java-plugins
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ steps.date.outputs.date }}
          name: CI Build ${{ steps.date.outputs.date }}
          body: |
            ## CI 自动构建

            本发行版由 GitHub Actions 自动构建，包含以下内容：

            ### 📱 WeKit APK (已修复 DEX 缓存更新问题)
            微信 Xposed 增强模块，内置已读追踪功能。下载安装即可使用。
            - 上游仓库: https://github.com/Ujhhgtg/WeKit
            - 源码: `wekit-module/`

            ### 🔌 Java 插件版已读服务器（服务端 + 客户端）
            独立的已读追踪服务器，支持以 HChat / WeKit / WAuxiliary / WuYu 插件或脚本形式运行。
            - **服务端插件**: 内置 cloudflared 公网隧道、Web 控制台、IP 地理位置查询
            - **客户端插件**: 让支持 Java 的模块（HChat/WA 等）也能发送追踪消息、查询已读人数
            - 源码: `plugins/java-read-tracker/` (服务端) · `plugins/read-tracker-client/` (客户端)

            ---
            - 构建分支: ${{ github.ref_name }}
            - 提交: ${{ github.sha }}
            - 构建时间: ${{ steps.date.outputs.date }}
          files: artifacts/*
          draft: false
          prerelease: true
