name: Build & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  NDK_VERSION: '30.0.14904198'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wekit-module
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;${{ env.NDK_VERSION }}'

      - name: Symlink android-37 platform
        run: |
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('wekit-module/**/*.gradle*', 'wekit-module/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wekit-module/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('wekit-module/**/Cargo.lock') }}

      - name: Build APK
        run: |
          chmod +x x gradlew
          ./x build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}

      - name: Find APK
        run: find app/build/outputs/apk -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wekit-standard-debug
          path: wekit-module/app/build/outputs/apk/**/*.apk
          retention-days: 30

  package-java-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Java plugin
        run: |
          cd plugins/java-read-tracker
          zip -r ../../read-tracker-java-plugin.zip . -x "*.git*"
          cd ../..
          ls -la read-tracker-java-plugin.zip

      - name: Upload Java plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: read-tracker-java-plugin
          path: read-tracker-java-plugin.zip
          retention-days: 30

  release:
    needs: [build-apk, package-java-plugin]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wekit-standard-debug
          path: artifacts

      - name: Download Java plugin
        uses: actions/download-artifact@v4
        with:
          name: read-tracker-java-plugin
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ steps.date.outputs.date }}
          name: CI Build ${{ steps.date.outputs.date }}
          body: |
            ## CI 自动构建

            本发行版由 GitHub Actions 自动构建，包含以下内容：

            ### 📱 WeKit APK (已修复 DEX 缓存更新问题)
            微信 Xposed 增强模块，内置已读追踪功能。下载安装即可使用。
            - 上游仓库: https://github.com/Ujhhgtg/WeKit
            - 源码: `wekit-module/`

            ### 🔌 Java 版已读服务器插件
            独立的已读追踪服务器，支持以 HChat 插件或 WeKit Java 脚本形式运行。
            - 内置 cloudflared 公网隧道
            - Web 控制台 + 微信内悬浮仪表盘
            - IP 地理位置查询
            - 源码: `plugins/java-read-tracker/`

            ---
            - 构建分支: ${{ github.ref_name }}
            - 提交: ${{ github.sha }}
            - 构建时间: ${{ steps.date.outputs.date }}
          files: artifacts/*
          draft: false
          prerelease: true
